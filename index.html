<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>短剧作品</title>
<style>
@font-face{font-family:"Kingnammm";src:url(fonts/Kingnammm.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"KCC Ganpan";src:url(fonts/KCC-Ganpan.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{--bg:#fff;--ink:#222;--soft:#888;--line:#e5e5e5;--side:#fafafa;--acc:#790fb2;--box:#f6f6f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--ink:#e6e6e6;--soft:#8e8e93;--line:#333;--side:#232326;--box:#28282b;--acc:#b794f6}}
:root[data-theme="dark"]{--bg:#1c1c1e;--ink:#e6e6e6;--soft:#8e8e93;--line:#333;--side:#232326;--box:#28282b;--acc:#b794f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 "Kingnammm","KCC Ganpan","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{border-bottom:1px solid var(--line);padding:30px 16px 0;text-align:center}
.top h1{margin:0;font-size:28px;letter-spacing:-.5px}
.top h1 a{display:inline-block}
.top p{margin:4px 0 16px;color:var(--soft);font-size:14px}
.gnb{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.gnb a{padding:10px 2px;font-weight:700;font-size:14px;border-bottom:2px solid transparent}
.gnb a.on{border-color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;display:flex;gap:40px;padding:30px 16px 60px;align-items:flex-start}
main{flex:1;min-width:0}
aside{width:230px;flex:none}
.box{background:var(--side);border:1px solid var(--line);padding:16px;margin-bottom:16px;font-size:14px}
.box h3{margin:0 0 8px;font-size:14px}
.pf{text-align:center}
.pf .av{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#111;color:#fff;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:22px}
.pf .av img{width:100%;height:100%;object-fit:cover;display:block}.pf p{margin:2px 0;color:var(--soft);font-size:13px;line-height:1.6}
.cat a{display:flex;justify-content:space-between;padding:3px 0}
.cat a.sub{padding-left:14px;color:var(--soft)}
.cat a.on{color:var(--acc);font-weight:700}
.cat small{color:var(--soft)}
.pfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pcard{display:block;border:1px solid var(--line);background:var(--side);padding:18px 16px;text-align:center}
.pcard:hover{border-color:var(--acc)}
.pcard img{width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px}
.pcard b{display:block;font-size:18px}
.pcard .bd{display:block;color:var(--soft);font-size:12px}
.pcard p{margin:8px 0 0;color:var(--soft);font-size:13px;line-height:1.6;text-align:left;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prof{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:0 0 22px;padding:18px;background:var(--box);border-left:3px solid var(--acc)}
.prof .pimg{width:140px;height:140px;border-radius:50%;margin:0;flex:none}
.pi .pn{font-size:22px;font-weight:700}
.pi .pb{color:var(--soft);font-size:14px}
.fl .dt2{color:var(--soft);font-size:13px;margin-right:6px}.fl .no{color:var(--soft);font-size:13px}.fl{padding-left:20px}.fl li{padding:2px 0}.fl a{border-bottom:1px solid var(--line)}.fl a:hover{color:var(--acc)}
.cat .rv{display:flex;align-items:center}.cat .rv a{flex:1}.tg{flex:none;background:none;border:0;color:var(--soft);font:inherit;font-size:13px;cursor:pointer;padding:2px 8px;min-width:32px;min-height:28px}.tg:hover{color:var(--ink)}.tg:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ptitle{font-size:14px;color:var(--soft);margin:0 0 14px}
.item{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.th{overflow:hidden;flex:none;width:96px;height:96px;background:var(--box);display:flex;align-items:center;justify-content:center;font-size:30px}
.item h2{margin:0;font-size:18px;line-height:1.4}
.item p{margin:6px 0 0;color:var(--soft);font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--soft);margin-top:6px}
.ph{padding-bottom:18px;border-bottom:1px solid var(--line)}
.ph .c{color:var(--acc);font-size:13px;font-weight:700}
.ph .dt{color:var(--soft);font-size:13px}
.ph h1{margin:4px 0 6px;font-size:26px;line-height:1.4}
.body{padding:22px 0;font-size:16px}
.body .info{background:var(--box);border-left:3px solid var(--acc);padding:12px 16px;margin:0 0 16px;font-size:15px}
.body .info div{display:flex;gap:12px}
.body .info b{width:60px;flex:none;color:var(--soft);font-weight:400}
.st{color:#f5a623;letter-spacing:1px}
.body ul{padding-left:20px;margin:8px 0}
.tags{padding:12px 0;border-top:1px solid var(--line);color:var(--soft);font-size:14px}.tags a{display:inline-block;margin:0 6px 4px 0;padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:var(--box)}.tags a:hover{color:var(--acc);border-color:var(--acc)}.info a{color:var(--acc);border-bottom:1px solid var(--acc)}.mo{margin-left:8px;font-size:13px;color:var(--acc);font-weight:400}.mo:hover{text-decoration:underline}
.nav{border-top:1px solid var(--line);margin-top:6px}
.nav a{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.nav b{width:48px;flex:none;color:var(--soft);font-weight:400}
.cm{margin-top:26px}
.cm h3{margin:0 0 8px;font-size:15px}
.cm textarea{width:100%;height:70px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}
.cm button{margin-top:6px;float:right;font:inherit;font-size:13px;background:var(--ink);color:var(--bg);border:0;padding:6px 14px;cursor:pointer}
.cl{clear:both;padding-top:12px}
.cl div{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.th img{width:100%;height:100%;object-fit:contain;display:block}.th.im{background:transparent}.pimg{display:block;width:160px;height:160px;object-fit:contain;margin:0 0 16px}.prof .pimg,.pcard .pimg{object-fit:cover}
.ck{list-style:none;padding:0!important;margin:8px 0}.ck li{padding:7px 0;border-bottom:1px solid var(--line)}.ck label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.ck input{flex:none;width:20px;height:20px;margin:4px 0 0;accent-color:var(--acc)}.ck input:checked+span{text-decoration:line-through;color:var(--soft)}
@media(max-width:760px){.wrap{flex-direction:column-reverse;gap:10px}aside{width:100%}.th{width:72px;height:72px}}
</style>
</head>

["서진진","코끝이 엉덩이코?라고 해서 갈라져있는데 갠적으로 이런 코 좋아함.. 입꼬리가 올라가 있어서 호감상이고 입이 가로로 길어서 시원하고 당찬 느낌","당차고 야무지고 혼자서도 잘 사는 여주 사회생활도 잘 하고 완전 남주 없이도 잘 삶 그치만 남주를 만나는 이유는 남주를 좋아하니깐..(당연) 똑똑하다기보단 임기응변이 좋은 편"]];

P.forEach(function(p){p.pin=PIN.indexOf(p.t)>-1});
P=P.filter(function(p){return p.pin}).sort(function(a,b){return PIN.indexOf(a.t)-PIN.indexOf(b.t)}).concat(P.filter(function(p){return !p.pin}));
var main=document.getElementById("main"),cat=document.getElementById("cat"),gnb=document.getElementById("gnb");
function inCat(p,c){return (c==="home"&&p.cat!=="actor")||p.cat===c||(p.also&&p.also.indexOf(c)>-1)||(c==="review"&&p.cat.indexOf("review")===0)}

var catOpen=true;try{catOpen=localStorage.getItem("catOpen")!=="0"}catch(e){}
function menu(cur){
 var h="<h3>카테고리</h3>",inSubs=false;
 CATS.forEach(function(c){
  var a="<a class='"+(c[2]?"sub ":"")+(c[0]===cur?"on":"")+"' href='#"+c[0]+"'><span>"+(c[2]?"└ ":"")+c[1]+"</span><small>("+cnt(c[0])+")</small></a>";
  if(!c[2]&&inSubs){h+="</div>";inSubs=false}
  if(c[0]==="review"){h+="<div class='rv'>"+a+"<button type='button' class='tg' id='tg' aria-controls='subs' aria-expanded='"+catOpen+"' aria-label='작품 후기 하위 목록 접기/펼치기'>"+(catOpen?"▾":"▸")+"</button></div><div id='subs'"+(catOpen?"":" hidden")+">";inSubs=true}
  else h+=a;
 });
 if(inSubs)h+="</div>";
 cat.innerHTML=h;
 document.getElementById("tg").onclick=function(){catOpen=!catOpen;try{localStorage.setItem("catOpen",catOpen?"1":"0")}catch(e){}document.getElementById("subs").hidden=!catOpen;this.setAttribute("aria-expanded",catOpen);this.textContent=catOpen?"▾":"▸"};
 gnb.innerHTML=["home","notice","review","actor","cp"].map(function(k){var n=CATS.filter(function(c){return c[0]===k})[0][1];return "<a class='"+(k===cur||(cur.indexOf("review-")===0&&k==="review")?"on":"")+"' href='#"+k+"'>"+n+"</a>"}).join("");
}
var ctx="";
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function itemHTML(p){return "<a class='item' href='#"+p.id+"'><div class='th"+(p.img?" im":"")+"'>"+(p.img?"<img alt='' src='"+p.img+"'>":p.th)+"</div><div><h2>"+p.t+"</h2><p>"+p.sum+"</p><div class='meta'>"+p.date+"</div></div></a>"}
function route(){
 var h=location.hash.slice(1)||"home",post=P.filter(function(p){return p.id===h})[0];

 if(h.indexOf("tag-")===0){var tg=h.slice(4);try{tg=decodeURIComponent(tg)}catch(e){}ctx="";menu("");var tl=P.filter(function(p){return p.tags.indexOf(tg)>-1});main.innerHTML="<p class='ptitle'>#"+esc(tg)+" ("+tl.length+") · <a href='#home' style='text-decoration:underline'>전체 글</a></p>"+(tl.length?tl.map(itemHTML).join(""):"<p>이 태그가 달린 글이 없어요.</p>");return}
 if(post){
  var cc=(ctx&&ctx!=="home"&&ctx!=="review"&&inCat(post,ctx))?ctx:post.cat;
  var group=P.filter(function(p){return inCat(p,cc)}),i=group.indexOf(post),prev=group[i+1],next=group[i-1];
  menu(cc);
  var cn=CATS.filter(function(c){return c[0]===cc})[0][1];
  main.innerHTML="<div class='ph'><span class='dt'>"+post.date+"</span><h1></h1></div><div class='body'>"+post.body+"</div><div class='tags'>"+post.tags.filter(function(t){return !SHARE.hasOwnProperty(t)}).map(function(t){return "<a href='#tag-"+encodeURIComponent(t)+"'>#"+esc(t)+"</a>"}).join(" ")+"</div><div class='nav'>"+(next?"<a href='#"+next.id+"'><b>다음글</b>"+next.t+"</a>":"")+(prev?"<a href='#"+prev.id+"'><b>이전글</b>"+prev.t+"</a>":"")+"</div><div class='cm'><h3>댓글 (<span id='n'>0</span>)</h3><textarea id='ta' placeholder='댓글을 남겨 보세요' aria-label='댓글'></textarea><button id='bt'>등록</button><div class='cl' id='cl'></div></div>";
  main.querySelector("h1").textContent=post.t;
  Array.prototype.forEach.call(main.querySelectorAll(".info > div"),function(d){var b=d.querySelector("b");if(!b||b.textContent!=="배우")return;var html=d.innerHTML,k=html.indexOf("</b>")+4,head=html.slice(0,k),rest=html.slice(k);Object.keys(SHARE).forEach(function(n){var ap=P.filter(function(q){return q.cat==="actor"&&q.t===n})[0];if(ap)rest=rest.split(n).join("<a href='#"+ap.id+"' data-ctx='actor'>"+n+"</a>")});d.innerHTML=head+"<span>"+rest+"</span>"});
  Array.prototype.forEach.call(main.querySelectorAll("input[data-k]"),function(el){var k="ck:"+el.getAttribute("data-k");try{var v=localStorage.getItem(k);if(v!==null)el.checked=v==="1"}catch(e){}el.onchange=function(){try{localStorage.setItem(k,el.checked?"1":"0")}catch(e){}}});
  var n=0;document.getElementById("bt").onclick=function(){var v=document.getElementById("ta").value.trim();if(!v)return;var d=document.createElement("div");d.textContent=v;document.getElementById("cl").prepend(d);document.getElementById("ta").value="";document.getElementById("n").textContent=++n};
 }else{
  if(!CATS.some(function(c){return c[0]===h}))h="home";
  ctx=h;
  menu(h);
  var name=CATS.filter(function(c){return c[0]===h})[0][1];
  var list=P.filter(function(p){return inCat(p,h)});
  if(h==="actor"){
   main.innerHTML="<p class='ptitle'>"+name+" ("+list.length+")</p><div class='pfgrid'>"+list.map(function(p){return "<a class='pcard' href='#"+p.id+"'>"+(p.img?"<img alt='' src='"+p.img+"'>":"")+"<b>"+p.t+"</b>"+(BD[p.t]?"<span class='bd'>"+bz(p.t)+"</span>":"")+"<p>"+p.sum+"</p></a>"}).join("")+"</div>";
   return;
  }
  main.innerHTML="<p class='ptitle'>"+name+" ("+list.length+")</p>"+list.map(function(p){return "<a class='item' href='#"+p.id+"'><div class='th"+(p.img?" im":"")+"'>"+(p.img?"<img alt='' src='"+p.img+"'>":p.th)+"</div><div><h2>"+(p.pin?"":"")+p.t+"</h2><p>"+p.sum+"</p><div class='meta'>"+p.date+"</div></div></a>"}).join("");
 }
